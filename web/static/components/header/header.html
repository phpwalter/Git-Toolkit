<header>
    <section class="mdc-top-app-bar__section mdc-top-app-bar__section--align-start">
        <i class="icon site-title__icon" data-lucide="shield-check"></i>
        <span class="mdc-top-app-bar__title"><b>Commit</b>Guardian</span>
    </section>

    <div class="header-right-column">
        <div class="search-container" id="searchContainer">
            <button class="search-trigger" id="searchTrigger" title="Search">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </button>

            <div class="search-inner">
                <input type="text" class="search-input" placeholder="Search..." id="searchInput" autocomplete="off">
                <button class="clear-btn" id="clearBtn" title="Clear">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
        </div>
        <button class="icon-button" aria-label="Messages">
            <i class="icon" data-lucide="message-square"></i>
        </button>
        <button class="icon-button" aria-label="Notifications">
            <i class="icon" data-lucide="bell"></i>
        </button>
        <button class="icon-button" aria-label="Settings" id="settings-button">
            <i class="icon" data-lucide="settings"></i>
        </button>
        <div class="header-separator"></div>
        <img src="https://www.gravatar.com/avatar/22082342b1aa17561688069516d26889?d=mp&f=y" alt="User Avatar" class="gravatar-icon" id="user-avatar">
    </div>
</header>

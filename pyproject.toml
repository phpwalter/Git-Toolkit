[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "git-toolkit"
version = "0.9.0.dev0"
description = "Deterministic Git workflow orchestration and policy enforcement for repositories and multi-repository workspaces."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "GitPython>=3.1.44",
    "pydantic>=2.9.2",
    "PyYAML>=6.0.1",
    "keyring>=24.3.0",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7.10",
    "build>=1.2.2",
    "mypy>=1.11.0",
    "pip-audit>=2.7.3",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools]
packages = ["git_toolkit"]

[project.scripts]
git-toolkit = "git_toolkit.cli:main"

[project.entry-points."git_toolkit.plugins"]
# Plugins register here using: name = "package.module:PluginClass"

[tool.semantic_release]
version_variable = "git_toolkit/version.py:__version__"
version_toml = ["pyproject.toml:project.version"]
major_on_zero = true
branch = "main"
upload_to_pypi = false
upload_to_release = true
build_command = "python -m build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["git_toolkit/tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["git_toolkit"]
omit = ["git_toolkit/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
